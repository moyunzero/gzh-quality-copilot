<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>MP list pager fixture</title>
  </head>
  <body>
    <ul id="list" class="mp-msg-list"></ul>
    <nav class="pager">
      <button type="button" id="next-btn">下一页</button>
    </nav>
    <script>
      // Offline pager stand-in: two pages of titles; button advances then disables.
      window.__pages = [
        [
          { title: "页一甲", url: "https://mp.weixin.qq.com/s/a1" },
          { title: "页一乙", url: "https://mp.weixin.qq.com/s/a2" },
        ],
        [
          { title: "页二丙", url: "https://mp.weixin.qq.com/s/b1" },
          { title: "页二丁", url: "https://mp.weixin.qq.com/s/b2" },
        ],
      ];
      window.__pageIndex = 0;
      function render() {
        const list = document.getElementById("list");
        list.innerHTML = "";
        for (const row of window.__pages[window.__pageIndex]) {
          const li = document.createElement("li");
          li.className = "mp-msg-item";
          li.setAttribute("data-title", row.title);
          li.setAttribute("data-url", row.url);
          list.appendChild(li);
        }
        const btn = document.getElementById("next-btn");
        btn.disabled = window.__pageIndex >= window.__pages.length - 1;
        if (btn.disabled) btn.setAttribute("aria-disabled", "true");
        else btn.removeAttribute("aria-disabled");
      }
      document.getElementById("next-btn").addEventListener("click", () => {
        if (window.__pageIndex < window.__pages.length - 1) {
          window.__pageIndex += 1;
          render();
        }
      });
      render();
    </script>
  </body>
</html>
